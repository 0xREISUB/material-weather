name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip
      - name: Test
        run: npm test
      - name: Package
        run: bash scripts/package.sh
